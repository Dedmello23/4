<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Soft watercolor blur and texture filters -->
    <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="0.8" />
    </filter>
    <radialGradient id="petalGrad1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F4DFDC" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#D9A5A5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7C3349" stop-opacity="0.85" />
    </radialGradient>
    <radialGradient id="petalGrad2" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FAF0ED" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#E5B2B2" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9A455E" stop-opacity="0.8" />
    </radialGradient>
    <radialGradient id="centerGrad" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="40%" stop-color="#E2B773" />
      <stop offset="85%" stop-color="#C7A66A" />
      <stop offset="100%" stop-color="#7A5623" />
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8D6BE" />
      <stop offset="60%" stop-color="#A5B59A" />
      <stop offset="100%" stop-color="#6F8064" />
    </linearGradient>
  </defs>

  <g filter="url(#watercolor)" transform="translate(250,250)">
    <!-- Leaves -->
    <path d="M-40,60 C-100,100 -120,170 -90,210 C-50,220 -20,180 -10,110 Z" fill="url(#leafGrad)" opacity="0.85" />
    <path d="M40,50 C90,90 140,140 130,190 C90,210 50,170 20,100 Z" fill="url(#leafGrad)" opacity="0.85" />
    <path d="M-10,100 C-5,160 5,210 10,250 C12,250 8,160 5,100 Z" fill="#6F8064" opacity="0.7" />

    <!-- Back Petals -->
    <path d="M0,-30 C-60,-170 -130,-150 -120,-80 C-110,-20 -50,-10 0,-20 Z" fill="url(#petalGrad1)" />
    <path d="M20,-30 C80,-160 150,-130 130,-60 C110,-5 50,-10 10,-20 Z" fill="url(#petalGrad2)" />
    <path d="M30,0 C160,-40 180,40 120,90 C70,120 30,50 15,20 Z" fill="url(#petalGrad1)" />
    <path d="M-30,0 C-160,-30 -170,50 -110,100 C-60,130 -30,50 -15,20 Z" fill="url(#petalGrad2)" />
    <path d="M-10,30 C-50,140 50,150 20,40 Z" fill="url(#petalGrad1)" />

    <!-- Front layered delicate petals -->
    <path d="M-5,-10 C-40,-120 40,-130 15,-15 Z" fill="url(#petalGrad2)" opacity="0.95" />
    <path d="M5,-10 C70,-80 110,-10 20,5 Z" fill="url(#petalGrad1)" opacity="0.92" />
    <path d="M-5,-5 C-70,-70 -100,0 -15,10 Z" fill="url(#petalGrad2)" opacity="0.92" />
    <path d="M-5,10 C-40,80 50,80 10,10 Z" fill="url(#petalGrad1)" opacity="0.95" />

    <!-- Floral Pistil / Stamen center -->
    <circle cx="0" cy="0" r="32" fill="url(#centerGrad)" />
    
    <!-- Delicate hand-drawn gold stamen dots -->
    <circle cx="-12" cy="-10" r="3.5" fill="#FFEBBF" />
    <circle cx="10" cy="-14" r="3" fill="#FFEBBF" />
    <circle cx="14" cy="8" r="3.5" fill="#FFEBBF" />
    <circle cx="-8" cy="12" r="3" fill="#FFEBBF" />
    <circle cx="0" cy="-2" r="4.5" fill="#FFF7E6" />
    <circle cx="-18" cy="2" r="2.5" fill="#C7A66A" />
    <circle cx="18" cy="-4" r="2.5" fill="#C7A66A" />
    <circle cx="4" cy="18" r="2.5" fill="#C7A66A" />
    <circle cx="-4" cy="-18" r="2.5" fill="#C7A66A" />

    <!-- Delicate sparkle accents -->
    <path d="M-100,-100 Q-95,-85 -80,-80 Q-95,-75 -100,-60 Q-105,-75 -120,-80 Q-105,-85 -100,-100 Z" fill="#C7A66A" opacity="0.8" />
    <path d="M110,-80 Q115,-65 130,-60 Q115,-55 110,-40 Q105,-55 90,-60 Q105,-65 110,-80 Z" fill="#C7A66A" opacity="0.7" />
  </g>
</svg>
